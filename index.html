<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julia Schaeffler — Portfolio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light by
      // default, regardless of the OS preference. Keep the key in sync with
      // ThemeToggle.tsx.
      var t = "light";
      try {
        if (localStorage.getItem("theme-choice") === "dark") t = "dark";
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

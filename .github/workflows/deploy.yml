name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment, skip runs queued in between
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # New images saved without a size get a varied one written back to the
      # Markdown, so it shows in Pages CMS for manual tweaking. Done here rather
      # than in its own workflow because pushes made with GITHUB_TOKEN don't
      # trigger other workflows; this build already uses the filled sizes, and
      # Netlify rebuilds on the bot commit.
      - name: Assign missing image sizes
        run: |
          npm run sizes
          if [ -n "$(git status --porcelain content/projects)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/projects
            git commit -m "Assign image sizes"
            git push
          fi

      - name: Build
        run: npm run build
        # Project page: served from j-schaeff.github.io/Portfolio-website-Julia/
        env:
          DEPLOY_BASE: /Portfolio-website-Julia/
          # For user/organization pages and custom domains, use 
          # DEPLOY_BASE: /

      # SPA fallback so client-side (BrowserRouter) routes work on Pages
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

media:
  input: public/images/uploads
  output: /images/uploads
  extensions: [jpg, jpeg, png, gif, svg, mov, mp4]
  categories: [image, video]

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{fields.title}.md"
    format: yaml-frontmatter
    view:
      fields: [title, type, year]
      primary: title
      sort: [title, year]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
      - name: type
        label: Type
        type: string
      - name: description
        label: Description
        type: text
      - name: year
        label: Year
        type: number
      - name: images
        label: Images
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            description: Upload or pick a jpg, jpeg, png, gif or svg file. For a video, leave this empty and use one of the video fields below.
            options:
              extensions: [jpg, jpeg, png, gif, svg]
          - name: video
            label: Video file
            type: file
            description: Optional. Upload or pick an mp4 or mov file. When set, it is shown instead of the image above.
            options:
              extensions: [mp4, mov]
          - name: videoUrl
            label: Video link
            type: string
            description: Optional. Paste a link to a video (e.g. a Dropbox share link or any direct video URL) to play it from there instead of uploading. When set, it overrides the file above.
          - name: size
            label: Size
            type: select
            description: Image height (width follows the image). Leave empty on new images and a varied size (2–5) is filled in automatically shortly after saving; change it any time.
            options:
              values:
                - { value: "1", label: "1" }
                - { value: "2", label: "2" }
                - { value: "3", label: "3" }
                - { value: "4", label: "4" }
                - { value: "5", label: "5" }
          - name: hideInGrid
            label: Hide in grid
            type: boolean
            default: false
            description: Hide this image in the grid overview, but still show it in the detail view.
          - name: alt
            label: Alt text
            type: string
            description: Optional description for screen readers and accessibility.

  - name: about
    label: About
    type: file
    path: content/about.md
    format: yaml-frontmatter
    fields:
      - name: bio
        label: Bio (column 1)
        type: text
        description: Separate paragraphs with an empty line. The links appear below this column.
      - name: column2
        label: Column 2 (Impressum & AGB)
        type: text
        description: Separate paragraphs with an empty line. Start a paragraph with "# " to make it a heading, or with "> " to indent all of its lines.
      - name: column3
        label: Column 3
        type: text
        description: Separate paragraphs with an empty line.
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
            description: A web address, or mailto:you@example.com for email.

  # One list that sets the order of the projects on the site; drag entries to
  # reorder. Read by src/data/projects.ts, where unlisted projects go last.
  - name: order
    label: Project order
    type: file
    path: content/order.md
    format: yaml-frontmatter
    fields:
      - name: projects
        label: Projects
        type: reference
        list: true
        description: Drag to reorder; the top project shows first. Add new projects here, or they appear at the end.
        options:
          collection: projects
          search: title
          value: "{path}"
          label: "{title}"

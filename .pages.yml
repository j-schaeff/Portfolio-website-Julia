media:
  input: public/images/uploads
  output: /images/uploads
  extensions: [jpg, jpeg, png, gif, svg, mov, mp4]
  categories: [image, video]

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{fields.title}.md"
    format: yaml-frontmatter
    view:
      fields: [order, title, type, year]
      primary: title
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
      - name: type
        label: Type
        type: string
      - name: description
        label: Description
        type: text
      - name: year
        label: Year
        type: number
      - name: order
        label: Order
        type: number
        description: Controls position in the grid and lists (ascending).
      - name: images
        label: Images
        type: object
        list: true
        fields:
          - name: image
            label: Image or video
            type: image
            description: Upload or pick a jpg, jpeg, png, gif, mov or mp4 file. Leave empty if you paste a video link below instead.
            options:
              extensions: [jpg, jpeg, png, gif, svg, mov, mp4]
          - name: videoUrl
            label: Video link
            type: string
            description: Optional. Paste a link to a video (e.g. a Dropbox share link or any direct video URL) to play it from there instead of uploading. When set, it overrides the file above.
          - name: size
            label: Size
            type: select
            description: Image height (width follows the image). Auto picks a varied height (2–5) so the project gets a rhythm with its neighbours; choose 1–5 to set it manually.
            default: "auto"
            options:
              values:
                - { value: "auto", label: "Auto (rhythm)" }
                - { value: "1", label: "1" }
                - { value: "2", label: "2" }
                - { value: "3", label: "3" }
                - { value: "4", label: "4" }
                - { value: "5", label: "5" }
          - name: hideInGrid
            label: Hide in grid
            type: boolean
            default: false
            description: Hide this image in the grid overview, but still show it in the detail view.
          - name: alt
            label: Alt text
            type: string
            description: Optional description for screen readers and accessibility.

  - name: about
    label: About
    type: file
    path: content/about.md
    format: yaml-frontmatter
    fields:
      - name: bio
        label: Bio (column 1)
        type: text
        description: Separate paragraphs with an empty line. The links appear below this column.
      - name: column2
        label: Column 2 (Impressum & AGB)
        type: text
        description: Separate paragraphs with an empty line. Start a paragraph with "# " to make it a heading, or with "> " to indent all of its lines.
      - name: column3
        label: Column 3
        type: text
        description: Separate paragraphs with an empty line.
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
            description: A web address, or mailto:you@example.com for email.
